# GoReleaser Configuration for Go CMS
# Documentation: https://goreleaser.com

version: 2

project_name: go-cms

before:
  hooks:
    - go mod tidy
    # Build React Admin SPA so embed.FS picks up the latest assets
    - npm --prefix admin run build

builds:
  - id: go-cms
    main: ./cmd/go-cms
    binary: go-cms
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/go-cms/cms/internal/cli.Version={{ .Version }}
      - -X github.com/go-cms/cms/internal/cli.GitCommit={{ .Commit }}
      - -X github.com/go-cms/cms/internal/cli.BuildDate={{ .Date }}

archives:
  - id: default
    builds:
      - go-cms
    name_template: "go-cms_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - themes/default/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: go-cms
    name: cms
  draft: false
  prerelease: auto
  mode: replace

