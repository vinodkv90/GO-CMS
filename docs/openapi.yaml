openapi: 3.0.3
info:
  title: Go CMS Platform API
  description: |
    Production-grade, extensible Content Management System (CMS) API in Go.
    Supports dual operating modes: Headless JSON REST APIs and traditional Go `html/template` server rendering.
  version: 1.0.0
  contact:
    name: Go CMS Team
    url: https://github.com/go-cms/cms

servers:
  - url: /api/v1
    description: Current API v1 endpoint
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /ping:
    get:
      summary: Health ping
      tags: [System]
      responses:
        '200':
          description: Server pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  /auth/login:
    post:
      summary: Authenticate administrative user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: Admin@CMS2026!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Bearer access token
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /content-types:
    get:
      summary: List all registered content types
      tags: [Content Types]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of content types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentType'
    post:
      summary: Create a new dynamic content type
      tags: [Content Types]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, uid, kind]
              properties:
                name:
                  type: string
                  example: Blog Articles
                uid:
                  type: string
                  example: articles
                kind:
                  type: string
                  enum: [collection, single]
                  example: collection
      responses:
        '201':
          description: Content type created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentType'

  /content-types/{uid}/fields:
    post:
      summary: Add a custom field to content type schema
      tags: [Content Types]
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentField'
      responses:
        '200':
          description: Schema updated with new field

  /content/{uid}:
    get:
      summary: Query content entries by content type
      tags: [Content Engine]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: preview
          in: query
          schema:
            type: boolean
          description: If true, include draft data (requires authentication)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of content entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentEntry'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
    post:
      summary: Create new content entry draft
      tags: [Content Engine]
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: Schema fields payload
      responses:
        '201':
          description: Draft entry created

  /content/{uid}/{id}:
    get:
      summary: Get content entry by ID
      tags: [Content Engine]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry found
    patch:
      summary: Update content entry draft (with optimistic locking)
      tags: [Content Engine]
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, expected_version]
              properties:
                data:
                  type: object
                expected_version:
                  type: integer
                  description: Current draft version for optimistic concurrency control
      responses:
        '200':
          description: Draft entry updated

  /content/{uid}/{id}/publish:
    post:
      summary: Publish draft content to live site
      tags: [Content Engine]
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry published

  /content/{uid}/{id}/unpublish:
    post:
      summary: Unpublish entry (revert to draft state)
      tags: [Content Engine]
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry unpublished

  /media:
    get:
      summary: List uploaded media assets
      tags: [Media Library]
      parameters:
        - name: folder_id
          in: query
          schema:
            type: string
          description: Optional folder ID or "root" for unorganized assets
        - name: search
          in: query
          schema:
            type: string
        - name: mime_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Array of media assets
    post:
      summary: Upload a new media asset
      tags: [Media Library]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder_id:
                  type: string
                  description: Optional target folder ID
                alt_text:
                  type: string
                caption:
                  type: string
      responses:
        '201':
          description: Asset uploaded

  /media/hls:
    post:
      summary: Upload complete HLS video stream package (.zip)
      tags: [Media Library]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP archive containing master playlist, variant playlists, segments (.ts/.m4s), and subtitles (.vtt)
                title:
                  type: string
                  description: Optional display title
                folder_id:
                  type: string
                  description: Optional target folder ID
      responses:
        '201':
          description: HLS video package uploaded and master asset created
        '400':
          description: Invalid package, zip bomb detected, or missing referenced segments

  /media/{id}/move:
    post:
      summary: Move media asset to a target folder
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_folder_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Asset relocated to new folder

  /media/tree:
    get:
      summary: Retrieve complete hierarchical folder tree
      tags: [Media Library]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Nested folder hierarchy with asset counts

  /media/folders:
    get:
      summary: List media folders
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: parent_id
          in: query
          schema:
            type: string
          description: Filter by parent folder ID or "root"
      responses:
        '200':
          description: Array of media folders
    post:
      summary: Create a new media folder
      tags: [Media Library]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                parent_id:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Folder created
        '409':
          description: Duplicate folder name under same parent

  /media/folders/{id}:
    get:
      summary: Get media folder details
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder details
    put:
      summary: Rename media folder and sync storage paths
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Folder renamed and storage prefix synchronized
    delete:
      summary: Delete media folder
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Folder deleted
        '409':
          description: Folder not empty and recursive not specified

  /media/folders/{id}/contents:
    get:
      summary: Get subfolders and assets within folder
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder contents including subfolders and assets

  /media/folders/{id}/move:
    post:
      summary: Move folder to new parent folder
      tags: [Media Library]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_parent_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Folder moved
        '400':
          description: Circular reference detected

  /media/{id}/signed-url:
    get:
      summary: Generate cryptographic HMAC-SHA256 signed URL
      tags: [Media Library]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: ttl
          in: query
          schema:
            type: integer
            default: 3600
      responses:
        '200':
          description: Signed URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url:
                    type: string
                  expires_in:
                    type: integer

  /plugins:
    get:
      summary: List installed and discovered plugins
      tags: [Plugins & SDK]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Discovered plugins array

  /plugins/{id}/enable:
    post:
      summary: Enable a plugin at runtime
      tags: [Plugins & SDK]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin enabled and routes mounted

  /plugins/{id}/disable:
    post:
      summary: Disable a plugin and unmount its dynamic routes
      tags: [Plugins & SDK]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin disabled

  /search:
    get:
      summary: Full-text search across published content
      tags: [Search & Indexing]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
          description: Optional content type filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results scored by TF-IDF with highlights

  /locales:
    get:
      summary: List registered language locales
      tags: [Localization]
      responses:
        '200':
          description: Registered locales array
    post:
      summary: Register a new locale
      tags: [Localization]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  example: es
                name:
                  type: string
                  example: Spanish
                direction:
                  type: string
                  enum: [ltr, rtl]
                  default: ltr
      responses:
        '201':
          description: Locale created

  /jobs:
    get:
      summary: List background asynchronous tasks
      tags: [Background Jobs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Job queue entries
  /jobs/stats:
    get:
      summary: Get job queue depth and status metrics
      tags: [Background Jobs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Queue statistics

  /audit-logs:
    get:
      summary: Query system audit trail
      tags: [Audit & Monitoring]
      security:
        - BearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audit log history

  /tenants:
    get:
      summary: List all organization workspaces
      tags: [Multi-Tenancy]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenants array
    post:
      summary: Create new tenant workspace
      tags: [Multi-Tenancy]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  example: Acme Corp
                slug:
                  type: string
                  example: acme
                domain:
                  type: string
                  example: acme.local
      responses:
        '201':
          description: Tenant created

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Token

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        roles:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string

    ContentType:
      type: object
      properties:
        id:
          type: string
        uid:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [collection, single]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContentField'

    ContentField:
      type: object
      required: [name, field_key, field_type]
      properties:
        name:
          type: string
          example: Article Title
        field_key:
          type: string
          example: title
        field_type:
          type: string
          enum:
            - short_text
            - long_text
            - rich_text
            - number
            - decimal
            - boolean
            - date
            - datetime
            - email
            - secret
            - url
            - enum
            - json
            - media
            - relation_single
            - relation_multiple
            - component
            - uid
          example: short_text
        configuration:
          type: object

    ContentEntry:
      type: object
      properties:
        id:
          type: string
        content_type_id:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        draft_version:
          type: integer
        published_version:
          type: integer
        draft_data:
          type: object
        published_data:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

