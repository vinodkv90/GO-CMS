version: '3.8'

services:
  # Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: go_cms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_cms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Alternative Relational Database (MySQL 8.4 LTS)
  mysql:
    image: mysql:8.4
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: cms_db
      MYSQL_USER: cms
      MYSQL_PASSWORD: cms_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cms", "-pcms_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Document Database (MongoDB 7.0)
  mongodb:
    image: mongo:7.0
    container_name: cms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cms_root
      MONGO_INITDB_ROOT_PASSWORD: mongo_secret_password
      MONGO_INITDB_DATABASE: cms_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache and Distributed Coordination (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: cms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: cms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cms

  # Go CMS Application Server
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CMS_SERVER_HOST: "0.0.0.0"
      CMS_SERVER_PORT: 8080
      CMS_SERVER_ENV: "production"
      CMS_DB_DRIVER: "postgres"
      CMS_DB_HOST: "postgres"
      CMS_DB_PORT: 5432
      CMS_DB_USER: "postgres"
      CMS_DB_PASSWORD: "root"
      CMS_DB_NAME: "go_cms_db"
      CMS_DB_SSLMODE: "disable"
      CMS_CACHE_DRIVER: "redis"
      CMS_CACHE_REDIS_URL: "redis://redis:6379/0"
      CMS_JOBS_ENABLED: "true"
      CMS_JOBS_CONCURRENCY: 4
      CMS_AUTH_JWT_SECRET: "production-jwt-super-secret-key-32chars"
      CMS_AUTH_SESSION_SECRET: "production-session-super-secret-key"
      CMS_MEDIA_SIGNED_SECRET: "production-media-signed-hmac-key"
    volumes:
      - uploads_data:/app/uploads
      - ./themes:/app/themes
      - ./plugins:/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
  minio_data:
  uploads_data:
